name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  lint-and-test:
    name: Lint, Static Analysis & Pester Tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Pester & PSScriptAnalyzer Modules
        shell: pwsh
        run: |
          Install-Module -Name Pester, PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Setup actionlint
        shell: pwsh
        run: |
          $actionlintVer = "1.7.7"
          $url = "https://github.com/rhysd/actionlint/releases/download/v$actionlintVer/actionlint_${actionlintVer}_windows_amd64.zip"
          $zipPath = Join-Path $env:TEMP "actionlint.zip"
          $binDir = Join-Path $env:USERPROFILE "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $binDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $binDir

      - name: Run Full Repository Verification
        shell: pwsh
        run: |
          .\scripts\verify.ps1 full

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
