name: Unity Release Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      project-path:
        description: "Relative path to the Unity project root."
        required: false
        type: string
        default: "."
      build-targets:
        description: "JSON array of build target platforms to release."
        required: false
        type: string
        default: '["StandaloneWindows64", "Android", "WebGL"]'
      runner-labels:
        description: "JSON array of labels for runner selection."
        required: false
        type: string
        default: '["self-hosted", "windows", "unity"]'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false
      ANDROID_KEYALIAS_NAME:
        required: false
      ANDROID_KEYALIAS_PASS:
        required: false

permissions: {}

jobs:
  build:
    name: Build Release Packages
    uses: ./.github/workflows/unity-build.yml
    with:
      project-path: ${{ inputs.project-path }}
      build-targets: ${{ inputs.build-targets }}
      runner-labels: ${{ inputs.runner-labels }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
      ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Built Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Package Release Archives
        shell: pwsh
        run: |
          $artifactDir = "release-packages"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $folders = Get-ChildItem -Path "release-artifacts" -Directory
          foreach ($folder in $folders) {
              $zipPath = Join-Path $artifactDir "$($folder.Name).zip"
              Write-Host "Compressing $($folder.FullName) to $zipPath..."
              Compress-Archive -Path "$($folder.FullName)\*" -DestinationPath $zipPath -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Release ${{ needs.build.outputs.semver }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-packages/*
