name: Bug Report
description: Report a defect, build failure, or incorrect behavior in runner or pipeline scripts.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide detailed diagnostic information below.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows OS version, Unity Editor version, and PowerShell version.
      placeholder: "Windows 11 Pro 23H2 / Unity 2022.3.48f1 / PowerShell 7.4"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Run .\runner\install-unity.ps1 -ProjectVersionFile ...
        2. Execute batchmode test step ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs
      description: Relevant excerpt from Unity editor log or PowerShell output.
      render: shell
